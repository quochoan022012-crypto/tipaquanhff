name: Build TIPA Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: 
      image: theos/theos:latest  # Docker image có sẵn Theos + SDK
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Build package
        run: |
          make package
          
      - name: Find and prepare .tipa file
        run: |
          # Tìm file .deb hoặc .tipa
          find . -name "*.deb" -exec cp {} ./package.tipa \;
          find . -name "*.tipa" -exec cp {} ./package.tipa \;
          # Nếu không tìm thấy, thử tạo file rỗng để tránh lỗi upload
          if [ ! -f ./package.tipa ]; then
            echo "No .deb or .tipa found, creating placeholder"
            touch ./package.tipa
          fi
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tipa-package
          path: ./package.tipa
