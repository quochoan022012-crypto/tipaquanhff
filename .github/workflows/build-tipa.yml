# ... Phần đầu workflow giữ nguyên ...

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential unzip curl
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          
      - name: Build package
        run: |
          export THEOS=$HOME/theos
          make package
          
      - name: Rename to .tipa (if needed)
        run: |
          # Tìm file .deb và đổi tên thành .tipa
          find . -name "*.deb" -exec cp {} ./package.tipa \;
          # Hoặc nếu file đã là .tipa thì copy trực tiếp
          find . -name "*.tipa" -exec cp {} ./package.tipa \;
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4  # Đã đổi từ v3 sang v4
        with:
          name: tipa-package
          path: ./package.tipa
          # (Tùy chọn) Nếu bạn muốn nén file trước khi upload
          # compression-level: 0 
          # overwrite: true
