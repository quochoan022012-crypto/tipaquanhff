name: Build TIPA Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Theos & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential unzip curl wget libxml2-dev libplist-dev libzip-dev
          
          # Clone Theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # Tải và cài đặt toolchain iOS (ld64, cctools, iOS SDK)
          cd $HOME/theos
          wget https://github.com/theos/toolchain/releases/download/v1.0.0/toolchain-linux.tar.xz
          tar -xf toolchain-linux.tar.xz
          rm toolchain-linux.tar.xz
          
          # Tạo symlink cho toolchain
          mkdir -p $HOME/theos/toolchain/linux/iphone/bin
          ln -sf $HOME/theos/toolchain/bin/* $HOME/theos/toolchain/linux/iphone/bin/
          
          # Tải SDK iOS 14.5
          cd $HOME/theos/sdks
          wget https://github.com/theos/sdks/archive/master.zip
          unzip -o master.zip
          cp -r sdks-master/* ./
          rm -rf sdks-master master.zip
          
          # Thiết lập biến môi trường
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "THEOS_TOOLCHAIN=$HOME/theos/toolchain" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          echo "$HOME/theos/toolchain/bin" >> $GITHUB_PATH
          
      - name: Build package
        run: |
          export THEOS=$HOME/theos
          export THEOS_TOOLCHAIN=$HOME/theos/toolchain
          make package
          
      - name: Prepare .tipa file
        run: |
          # Tìm file .deb hoặc .tipa
          DEB_FILE=$(find . -name "*.deb" -type f | head -n 1)
          TIPA_FILE=$(find . -name "*.tipa" -type f | head -n 1)
          PKG_FILE=$(find . -name "*.package" -type f | head -n 1)
          
          if [ -f "$DEB_FILE" ]; then
            echo "✅ Found .deb file: $DEB_FILE"
            cp "$DEB_FILE" ./package.tipa
          elif [ -f "$TIPA_FILE" ]; then
            echo "✅ Found .tipa file: $TIPA_FILE"
            cp "$TIPA_FILE" ./package.tipa
          elif [ -f "$PKG_FILE" ]; then
            echo "✅ Found .package file: $PKG_FILE"
            cp "$PKG_FILE" ./package.tipa
          else
            echo "❌ No package file found!"
            echo "📁 Files in current directory:"
            ls -la
            echo "📁 Files in .theos directory:"
            find .theos -name "*.deb" -o -name "*.tipa" -o -name "*.package" 2>/dev/null || echo "No .theos directory"
            # Tạo file rỗng để tránh lỗi upload
            touch ./package.tipa
          fi
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tipa-package
          path: ./package.tipa
